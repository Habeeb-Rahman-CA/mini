name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pages: write

jobs:
  verify:
    name: Verify Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:examples
      - run: npm run build:standalone

  github-release:
    name: Create GitHub Release & Standalone Artifacts
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run build:standalone
      - name: Package npm tarball
        run: npm pack
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/standalone/minilang.mjs
            dist/standalone/minilang.cjs
            minilang-eng-*.tgz

  publish-npm:
    name: Publish to npm Registry
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --provenance --access public
          else
            echo "Skipping npm publish: NPM_TOKEN secret is not configured."
          fi

  publish-vscode:
    name: Package & Publish VS Code Extension
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Package VSIX
        working-directory: editors/vscode-mini
        run: npx --yes @vscode/vsce package --no-dependencies -o minilang-vscode.vsix
      - name: Upload VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: editors/vscode-mini/minilang-vscode.vsix
      - name: Publish to VS Code Marketplace
        working-directory: editors/vscode-mini
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"
          else
            echo "Skipping Marketplace publish: VSCE_PAT secret is not configured."
          fi

  deploy-docs:
    name: Deploy Documentation Site to GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"
      - id: deployment
        uses: actions/deploy-pages@v4

