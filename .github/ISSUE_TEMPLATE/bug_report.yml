name: Bug Report
description: Report a bug in the Mini language, CLI, or VS Code extension
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal .mini Program to Reproduce
      description: Paste the .mini snippet that triggers the issue.
      render: mini
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Output vs Actual Output
      description: What did you expect Mini to output, and what did it output instead?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment (OS, Node.js version, minilang version)
      placeholder: "e.g. Ubuntu 24.04, Node v24.14.1, minilang v1.0.0"
    validations:
      required: true

